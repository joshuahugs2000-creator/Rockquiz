<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ROCKQUIZ</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Logo avec image -->
            <div class="auth-logo">
                <img src="images/logoo.jpg" alt="ROCKQUIZ Logo" class="auth-logo-img">
                <p>Connectez-vous pour continuer</p>
            </div>

            <div id="authMessage" class="auth-message"></div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">
                    <span>Connexion</span>
                </button>
                <button class="auth-tab" onclick="switchTab('register')">
                    <span>Inscription</span>
                </button>
            </div>

            <!-- Formulaire de Connexion -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginEmail" required placeholder="votre@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label>🔒 Mot de passe</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" class="auth-submit" id="loginBtn">
                    🔓 Se connecter
                </button>
            </form>

            <!-- Formulaire d'Inscription -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label>👤 Pseudo</label>
                    <input type="text" id="registerUsername" required placeholder="Votre pseudo" minlength="3" maxlength="20" autocomplete="username">
                </div>

                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="registerEmail" required placeholder="votre@email.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label>🔒 Mot de passe</label>
                    <input type="password" id="registerPassword" required placeholder="••••••••" minlength="6" autocomplete="new-password">
                </div>

                <button type="submit" class="auth-submit" id="registerBtn">
                    🚀 S'inscrire
                </button>
            </form>

            <div class="auth-divider">OU</div>

            <button class="google-btn" id="googleSignInBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continuer avec Google
            </button>

            <div class="back-home">
                <a href="index.html">← Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // Variable globale Supabase
        var supabaseClient;

        // Changer d'onglet
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.auth-tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            tabs.forEach(t => t.classList.remove('active'));

            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                tabs[1].classList.add('active');
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
            }

            hideMessage();
        }

        // Afficher message
        function showMessage(text, type) {
            const msgDiv = document.getElementById('authMessage');
            msgDiv.textContent = text;
            msgDiv.className = `auth-message ${type} show`;
        }

        function hideMessage() {
            const msgDiv = document.getElementById('authMessage');
            msgDiv.classList.remove('show');
        }

        // Messages d'erreur plus clairs
        function getErrorMessage(error) {
            const messages = {
                'Invalid login credentials': 'Email ou mot de passe incorrect',
                'Email not confirmed': 'Veuillez confirmer votre email avant de vous connecter',
                'User already registered': 'Cet email est déjà utilisé',
                'Password should be at least 6 characters': 'Le mot de passe doit contenir au moins 6 caractères',
                'Unable to validate email address': 'Email invalide',
                'Signup requires a valid password': 'Mot de passe requis',
                'Email rate limit exceeded': 'Trop de tentatives, réessayez plus tard'
            };

            return messages[error.message] || error.message;
        }

        // Initialisation au chargement
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🚀 Initialisation de la page de connexion...');

            // Vérifier la configuration
            if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
                console.error('❌ Configuration Supabase manquante');
                showMessage('❌ Configuration incorrecte. Contactez l\'administrateur.', 'error');
                return;
            }

            console.log('✅ Config trouvée:', {
                url: window.SUPABASE_URL,
                keyStart: window.SUPABASE_KEY.substring(0, 20) + '...'
            });

            // Initialiser Supabase
            try {
                supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
                console.log('✅ Supabase initialisé avec succès');
            } catch (error) {
                console.error('❌ Erreur initialisation Supabase:', error);
                showMessage('❌ Erreur d\'initialisation: ' + error.message, 'error');
                return;
            }

            // Vérifier si déjà connecté
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    console.log('✅ Utilisateur déjà connecté, redirection...');
                    window.location.href = 'index.html';
                    return;
                }
            } catch (err) {
                console.error('Erreur vérification session:', err);
            }

            // Écouter les changements d'authentification
            supabaseClient.auth.onAuthStateChange((event, session) => {
                console.log('📡 Auth event:', event);
                if (session && event === 'SIGNED_IN') {
                    showMessage('✅ Connexion réussie !', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            });

            // CONNEXION
            const loginForm = document.getElementById('loginForm');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('📝 Soumission formulaire connexion');
                
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                const btn = document.getElementById('loginBtn');

                if (!email || !password) {
                    showMessage('❌ Veuillez remplir tous les champs', 'error');
                    return;
                }

                btn.disabled = true;
                btn.textContent = '⏳ Connexion...';

                try {
                    console.log('🔐 Tentative de connexion pour:', email);
                    
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        console.error('❌ Erreur de connexion:', error);
                        showMessage('❌ ' + getErrorMessage(error), 'error');
                        btn.disabled = false;
                        btn.textContent = '🔓 Se connecter';
                    } else {
                        console.log('✅ Connexion réussie:', data);
                        showMessage('✅ Connexion réussie !', 'success');
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    }
                } catch (err) {
                    console.error('❌ Exception connexion:', err);
                    showMessage('❌ Erreur: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = '🔓 Se connecter';
                }
            });

            // INSCRIPTION
            const registerForm = document.getElementById('registerForm');
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                console.log('📝 Soumission formulaire inscription');
                
                const username = document.getElementById('registerUsername').value.trim();
                const email = document.getElementById('registerEmail').value.trim();
                const password = document.getElementById('registerPassword').value;
                const btn = document.getElementById('registerBtn');

                if (!username || !email || !password) {
                    showMessage('❌ Veuillez remplir tous les champs', 'error');
                    return;
                }

                if (username.length < 3) {
                    showMessage('❌ Le pseudo doit contenir au moins 3 caractères', 'error');
                    return;
                }

                if (password.length < 6) {
                    showMessage('❌ Le mot de passe doit contenir au moins 6 caractères', 'error');
                    return;
                }

                btn.disabled = true;
                btn.textContent = '⏳ Inscription...';

                try {
                    console.log('📝 Tentative d\'inscription pour:', email);
                    
                    const { data, error } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                username: username,
                                avatar: '😎'
                            },
                            emailRedirectTo: window.location.origin + '/index.html'
                        }
                    });

                    if (error) {
                        console.error('❌ Erreur inscription:', error);
                        showMessage('❌ ' + getErrorMessage(error), 'error');
                        btn.disabled = false;
                        btn.textContent = '🚀 S\'inscrire';
                    } else {
                        console.log('✅ Inscription réussie:', data);
                        
                        // Vérifier si confirmation email requise
                        if (data.user && data.user.identities && data.user.identities.length === 0) {
                            showMessage('✅ Inscription réussie ! Vérifiez votre email pour confirmer votre compte.', 'success');
                        } else {
                            showMessage('✅ Inscription réussie ! Connexion automatique...', 'success');
                        }
                        
                        setTimeout(() => {
                            switchTab('login');
                            btn.disabled = false;
                            btn.textContent = '🚀 S\'inscrire';
                        }, 3000);
                    }
                } catch (err) {
                    console.error('❌ Exception inscription:', err);
                    showMessage('❌ Erreur: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = '🚀 S\'inscrire';
                }
            });

            // GOOGLE SIGN-IN
            const googleBtn = document.getElementById('googleSignInBtn');
            googleBtn.addEventListener('click', async function() {
                console.log('🔍 Clic sur bouton Google');
                
                try {
                    console.log('🔍 Tentative de connexion Google...');
                    
                    const { data, error } = await supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/index.html'
                        }
                    });

                    if (error) {
                        console.error('❌ Erreur Google:', error);
                        if (error.message.includes('not enabled')) {
                            showMessage('❌ Google OAuth non configuré dans Supabase', 'error');
                        } else {
                            showMessage('❌ Erreur: ' + error.message, 'error');
                        }
                    } else {
                        console.log('✅ Redirection Google initiée');
                    }
                } catch (err) {
                    console.error('❌ Exception Google:', err);
                    showMessage('❌ Erreur: ' + err.message, 'error');
                }
            });

            console.log('✅ Tous les event listeners configurés');
        });
    </script>
</body>
</html>
